<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculadora" aria-label="Calculadora">
    <div class="pantalla">
      <div id="operacion" class="operacion"></div>
      <div id="resultado" class="resultado">0</div>
    </div>

    <div class="teclado">
      <button class="tecla funcion" data-accion="borrar-todo">AC</button>
      <button class="tecla funcion" data-accion="borrar">⌫</button>
      <button class="tecla funcion" data-accion="porcentaje">%</button>
      <button class="tecla operador" data-operador="/">÷</button>

      <button class="tecla" data-numero="7">7</button>
      <button class="tecla" data-numero="8">8</button>
      <button class="tecla" data-numero="9">9</button>
      <button class="tecla operador" data-operador="*">×</button>

      <button class="tecla" data-numero="4">4</button>
      <button class="tecla" data-numero="5">5</button>
      <button class="tecla" data-numero="6">6</button>
      <button class="tecla operador" data-operador="-">−</button>

      <button class="tecla" data-numero="1">1</button>
      <button class="tecla" data-numero="2">2</button>
      <button class="tecla" data-numero="3">3</button>
      <button class="tecla operador" data-operador="+">+</button>

      <button class="tecla cero" data-numero="0">0</button>
      <button class="tecla" data-accion="decimal">,</button>
      <button class="tecla igual" data-accion="igual">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
